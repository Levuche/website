name: Preview

# Gives every pull request into dev its own preview link, so testers can try
# the change before they approve it.
#
# It builds the pull request and uploads it as a new version of the dev
# Worker (levuche-com-dev) without deploying it: dev.levuche.com keeps
# showing the dev branch. The version gets the alias pr-<number>, so the link
# stays the same for the life of the pull request and moves to each new
# push:
#
#   https://pr-<number>-levuche-com-dev.<account subdomain>.workers.dev
#
# The link is posted as a comment on the pull request and kept up to date.
# Preview links are for the team only: Cloudflare Access asks for sign-in
# (docs/DEPLOY.md, "Keep the dev site private"), and they send noindex, block
# every crawler in robots.txt and have no sitemap. The checks below get past
# Access with a service token (secrets CF_ACCESS_CLIENT_ID and
# CF_ACCESS_CLIENT_SECRET); without one they only confirm the link asks for
# sign-in.
#
# Needs: the account's workers.dev subdomain, and "preview_urls": true on the
# dev Worker, which the first deploy of dev after this file lands turns on.
# Pull requests from forks and from Dependabot get no preview: they can't
# read the Cloudflare token.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview link
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Built like the dev site: never claims to be levuche.com, so noindex,
      # and sign-in sends people back to dev.levuche.com.
      NEXT_PUBLIC_SITE_URL: https://dev.levuche.com
      NEXT_PUBLIC_APP_URL: https://app-dev.levuche.com
      NEXT_PUBLIC_BUILDBASE_REDIRECT_URL: https://dev.levuche.com
      NEXT_PUBLIC_BUILDBASE_ORG_ID: ${{ vars.BUILDBASE_ORG_ID }}
      NEXT_PUBLIC_BUILDBASE_ENVIRONMENT: ${{ vars.BUILDBASE_ENVIRONMENT }}
      NEXT_PUBLIC_BUILDBASE_CLIENT_ID: ${{ vars.BUILDBASE_CLIENT_ID }}
      NEXT_PUBLIC_BUILDBASE_ANALYTICS: ${{ vars.BUILDBASE_ANALYTICS }}
      # Optional: a Cloudflare Access service token, so the checks can see
      # past the team sign-in.
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check the Cloudflare settings are in place
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (Settings > Secrets and variables > Actions). See docs/DEPLOY.md."
            exit 1
          fi

      - run: npm ci

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Upload a preview version of the dev Worker
        id: upload
        run: |
          set -o pipefail
          npx wrangler versions upload --env dev \
            --preview-alias "pr-$PR_NUMBER" \
            --tag "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER at ${HEAD_SHA:0:7}" | tee upload.log
          url=$(sed -n 's/^.*Version Preview Alias URL: \(https:[^ ]*\).*$/\1/p' upload.log | tail -n 1)
          if [ -z "$url" ]; then
            echo "::warning::The version uploaded but Cloudflare gave no preview link. Check that the account has a workers.dev subdomain and that the dev Worker was deployed with preview_urls on (docs/DEPLOY.md)."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.upload.outputs.url != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          auth=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            auth=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$URL/" || true)
            echo "preview: $code"
            [ "$code" = "200" ] && exit 0
            # 302: Cloudflare Access asks for sign-in, so the link is up.
            [ "$code" = "302" ] && [ ${#auth[@]} -eq 0 ] && exit 0
            sleep 10
          done
          echo "::warning::The preview link did not answer 200 yet."

      - name: Check the preview stays out of search
        if: steps.upload.outputs.url != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node scripts/check-indexing.mjs "$URL" private

      - name: Post the link on the pull request
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          marker='<!-- levuche-preview -->'
          body=$(printf '%s\n**Preview:** %s\n\nShows commit %s. The link stays the same for this pull request and updates on every push. It reads the Buildbase development content; sign-in sends you back to dev.levuche.com, so test sign-in there after the merge.' \
            "$marker" "$URL" "${HEAD_SHA:0:7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

      # After the link is posted: the same end-to-end tests as CI, against
      # the deployed preview, so the Worker runtime and the Buildbase
      # development content are covered too. Form posts are intercepted:
      # nothing is sent.
      - name: Install Chromium for Playwright
        if: steps.upload.outputs.url != ''
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests on the preview
        if: steps.upload.outputs.url != ''
        env:
          E2E_BASE_URL: ${{ steps.upload.outputs.url }}
        run: npm run e2e
