name: CI

# Lint, Prettier, the type check, the OpenNext build and a Wrangler dry run
# on every push and pull request. No secrets and no Buildbase values: every
# Buildbase feature switches itself off, so this builds what any fork can.

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Feature branches go into dev, and only dev goes into main, so
  # levuche.com only ever gets what dev.levuche.com already showed. Make this
  # a required check on main (docs/BRANCHES.md).
  source:
    name: Into main only from dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check where the pull request comes from
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; }; then
            echo "::error::Pull requests into main must come from dev. Open this one against dev instead."
            exit 1
          fi
          echo "$HEAD into $BASE is allowed."

  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build for Cloudflare Workers (OpenNext, runs next build)
        run: npm run cf:build

      - name: Bundle the Worker (dry run, no deploy)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run 2>&1 | tee wrangler-output.txt
          echo "## Cloudflare Worker" >> "$GITHUB_STEP_SUMMARY"
          grep "Total Upload" wrangler-output.txt >> "$GITHUB_STEP_SUMMARY" || true
