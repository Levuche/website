name: CI

# Lint, Prettier, the type check, the OpenNext build and a Wrangler dry run
# on every push and pull request. No secrets and no Buildbase values: every
# Buildbase feature switches itself off, so this builds what any fork can.

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Work branches (feature/, fix/ and the like) go into dev, and only dev
  # goes into main, so levuche.com only ever gets what dev.levuche.com
  # already showed. Make this a required check on dev and main
  # (docs/BRANCHES.md).
  branches:
    name: Branch rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the branch names
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Pull requests into main must come from dev. Open this one against dev instead."
              exit 1
            fi
          elif [ "$BASE" = "dev" ]; then
            if ! printf '%s' "$HEAD" | grep -Eq '^(feature|fix|hotfix|chore|docs|ci|dependabot)/[a-z0-9._/-]+$'; then
              echo "::error::Name the branch type/short-name, for example feature/beta-signup or fix/contact-form. Types: feature, fix, hotfix, chore, docs, ci."
              exit 1
            fi
          fi
          echo "$HEAD into $BASE is allowed."

  # Builds the site twice, once as levuche.com and once as the dev site, and
  # checks what search engines see on each: levuche.com is open with a
  # sitemap; the dev site and preview links say noindex everywhere, block
  # every crawler in robots.txt and have no sitemap (docs/DEPLOY.md).
  indexing:
    name: Search indexing (${{ matrix.site }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: production
            url: https://levuche.com
          - site: private
            url: https://dev.levuche.com
    env:
      NEXT_PUBLIC_SITE_URL: ${{ matrix.url }}
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Start the site
        run: |
          npx next start -p 3200 > next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3200/robots.txt && exit 0
            sleep 2
          done
          cat next-start.log
          exit 1

      - name: Check what search engines see
        env:
          CHECK_ASSET_HEADERS: '1'
        run: npm run check:indexing -- http://localhost:3200 "$SITE"

  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build for Cloudflare Workers (OpenNext, runs next build)
        run: npm run cf:build

      - name: Bundle the Worker (dry run, no deploy)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run 2>&1 | tee wrangler-output.txt
          echo "## Cloudflare Worker" >> "$GITHUB_STEP_SUMMARY"
          grep "Total Upload" wrangler-output.txt >> "$GITHUB_STEP_SUMMARY" || true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # A plain Next.js build with no Buildbase values: the pages fall back
      # to the seed content, as on a fork.
      - name: Build
        run: npm run build

      - name: Run the end-to-end tests
        run: npm run e2e
