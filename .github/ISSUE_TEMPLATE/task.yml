name: Task (Levuche team)
description: Planned work for the Levuche team.
body:
  - type: textarea
    id: goal
    attributes:
      label: What and why
      description: What changes for creators, buyers or the team, and why now.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Related issues, boards or docs
